name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          # Every branch deploys straight to production, so the base path is
          # always the site root. No preview sub-paths.
          BASE_PATH: /holy-penny/
        run: npm run build -- --base=$BASE_PATH

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # No `environment:` block on this job, matching the workflow as it
      # originally stood. Declaring the github-pages environment makes GitHub
      # evaluate that environment's deployment-branch rule before the job
      # starts, and this repo's rule allows only the default branch - the job
      # is then rejected outright. If you would rather have the environment
      # (it surfaces the deployed URL in the run), add it back here and allow
      # all branches under Settings -> Environments -> github-pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
